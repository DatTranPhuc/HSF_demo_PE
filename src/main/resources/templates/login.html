<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuc Dat - Login page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="card card-layout">
    <div class="card-layout-header">
        <i class="fa-solid fa-store"></i>
        <h1>Phuc Dat - Login page</h1>
    </div>

    <div th:if="${param.error}" class="message error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Invalid phone number or password.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required placeholder="0905xxxxxx">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
    </form>
</div>

</body>
</html>
