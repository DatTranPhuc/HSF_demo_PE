<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Sony Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header class="header card" th:if="${session.loggerInUser != null}">
    <div class="header-logo">
        <i class="fa-solid fa-store"></i>
        <h1>Sony Dashboard</h1>
    </div>
    <nav class="header-nav">
        <span class="welcome-text">Welcome, <b th:text="${session.loggerInUser.phone}">User</b>!</span>
        <a th:if="${session.loggerInUser.roleId == 1}"
           th:href="@{/addNewItem}"
           class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Add New
        </a>
        <a th:href="@{/logout}" class="btn btn-logout">
            <i class="fa-solid fa-power-off"></i> Logout
        </a>
    </nav>
</header>

<div class="container">
    <div class="search-bar">
        <form th:action="@{/home}" method="get" style="display: contents;">
            <input type="text" name="search" placeholder="Search products by name..."
                   th:value="${searchKeyword}">
            <button type="submit" class="btn">
                <i class="fa-solid fa-magnifying-glass"></i> Search
            </button>
        </form>
    </div>

    <div th:if="${session.loggerInUser.roleId == 1 and topProducts != null and !topProducts.isEmpty()}"
         class="content-card card">
        <div class="content-card-header">
            <h2><i class="fa-solid fa-star" style="color: #ffc107;"></i> Top Stock Products</h2>
        </div>
        <table class="product-table">
            <thead>
            <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>Stock</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${topProducts}">
                <td th:text="${product.productName}">Product Name</td>
                <td th:text="${product.sonyCategories.cateName}">Category</td>
                <td th:text="${product.stock}">Stock</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="content-card card">
        <div class="content-card-header">
            <h2><i class="fa-solid fa-boxes-stacked" style="color: #0d6efd;"></i> All Products</h2>
        </div>
        <table class="product-table">
            <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Created At</th>
                <th>Category</th>
                <th th:if="${session.loggerInUser.roleId == 1}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${products.isEmpty()}">
                <td colspan="6" style="text-align: center; padding: 30px; color: #6c757d; font-weight: 500;">
                    <i class="fa-solid fa-box-open fa-2x"></i>
                    <p style="margin-top: 10px;">No products found.</p>
                </td>
            </tr>
            <tr th:each="product : ${products}">
                <td th:text="${product.productName}">Product Name</td>
                <td th:text="${'$' + #numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">Price</td>
                <td th:text="${product.stock}">Stock</td>
                <td th:text="${#temporals.format(product.createAt, 'dd-MM-yyyy')}">Created At</td>
                <td th:text="${product.sonyCategories.cateName}">Category</td>

                <td th:if="${session.loggerInUser.roleId == 1}" class="actions">
                    <a th:href="@{/editProduct/{id}(id=${product.productId})}"
                       class="btn btn-secondary">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </a>
                    <a th:href="@{/deleteProduct/{id}(id=${product.productId})}"
                       class="btn btn-danger"
                       onclick="return confirm('Are you sure you want to delete this product?')">
                        <i class="fa-solid fa-trash-can"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
